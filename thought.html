<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BIMO — Мысль</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    .section-title {
      font-family: 'Bangers', cursive;
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: #F7C948;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .char-count {
      text-align: right;
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 6px;
    }
    .char-count.warn { color: var(--princess-pink); }
  </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="page">

  <div class="back-btn" onclick="history.back()">← Назад</div>

  <!-- Mini BMO -->
  <div class="bmo-wrap" style="margin-bottom: 6px;">
    <svg class="bmo-svg" style="width:60px;" viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">
      <rect x="10" y="15" width="100" height="115" rx="14" ry="14" fill="#7BC8A4"/>
      <rect x="20" y="25" width="80" height="58" rx="8" ry="8" fill="#4A9B7F"/>
      <rect x="23" y="28" width="74" height="52" rx="6" ry="6" fill="#A8E6CF">
        <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
      </rect>
      <ellipse cx="44" cy="50" rx="9" ry="10" fill="white"/>
      <ellipse cx="76" cy="50" rx="9" ry="10" fill="white"/>
      <ellipse cx="44" cy="51" rx="5" ry="6" fill="#1B2A3C"/>
      <ellipse cx="76" cy="51" rx="5" ry="6" fill="#1B2A3C"/>
      <circle cx="47" cy="48" r="2" fill="white" opacity="0.9"/>
      <circle cx="79" cy="48" r="2" fill="white" opacity="0.9"/>
      <path d="M48 68 Q60 76 72 68" stroke="#4A9B7F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <line x1="20" y1="95" x2="100" y2="95" stroke="#5CA88C" stroke-width="1"/>
      <circle cx="38" cy="112" r="8" fill="#FF6B9D"/>
      <circle cx="60" cy="112" r="8" fill="#FFD700"/>
      <circle cx="82" cy="112" r="8" fill="#74B9FF"/>
      <rect x="5" y="50" width="5" height="12" rx="2" fill="#5CA88C"/>
      <rect x="110" y="50" width="5" height="12" rx="2" fill="#5CA88C"/>
    </svg>
  </div>

  <h1 class="title" style="font-size:1.5rem; margin-bottom: 2px;">Записать мысль</h1>
  <p class="subtitle" style="margin-bottom: 18px;">Куда сохранить?</p>

  <!-- Category chips -->
  <div class="card" style="margin-bottom: 14px;">
    <div class="section-title">💭 Категория</div>
    <div class="chips" id="chips">
      <div class="chip active" data-val="thought">Мысль</div>
      <div class="chip" data-val="idea">💡 Идея</div>
      <div class="chip" data-val="event">📅 Событие</div>
      <div class="chip" data-val="study">📚 Учёба</div>
      <div class="chip" data-val="food">🥗 Питание</div>
      <div class="chip" data-val="life">🌱 Жизнь</div>
    </div>
  </div>

  <!-- Text input -->
  <div class="card">
    <label class="section-title" for="text-input">✍️ Текст</label>
    <textarea
      id="text-input"
      placeholder="Что у тебя на уме, искатель приключений?.."
      maxlength="3500"
      autofocus
    ></textarea>
    <div class="char-count" id="char-count">0 / 3500</div>

    <div class="divider"></div>

    <!-- Optional title for notes -->
    <label class="field-label" for="title-input">Заголовок заметки <span style="color:rgba(139,175,200,0.5)">(необязательно)</span></label>
    <input type="text" id="title-input" placeholder="Название файла в Obsidian..."/>

    <div id="status" class="status"></div>
  </div>

  <p class="tg-hint">Нажми синюю кнопку внизу, чтобы сохранить</p>

</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  // Stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 0.5;
    s.style.cssText = `width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--dur:${Math.random()*3+2}s;--delay:${Math.random()*3}s;`;
    starsEl.appendChild(s);
  }

  // Category selection
  let selectedCategory = 'thought';
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      selectedCategory = chip.dataset.val;
    });
  });

  // Char counter
  const textEl = document.getElementById('text-input');
  const counterEl = document.getElementById('char-count');
  textEl.addEventListener('input', () => {
    const n = textEl.value.length;
    counterEl.textContent = `${n} / 3500`;
    counterEl.classList.toggle('warn', n > 3000);
    updateMainBtn();
  });

  // Main button
  tg.MainButton.setText('💾 Сохранить').show();
  tg.MainButton.disable();

  function updateMainBtn() {
    if (textEl.value.trim().length > 0) {
      tg.MainButton.enable();
    } else {
      tg.MainButton.disable();
    }
  }

  tg.MainButton.onClick(() => {
    const text = textEl.value.trim();
    const title = document.getElementById('title-input').value.trim();
    if (!text) return;

    tg.MainButton.showProgress(true);

    const payload = JSON.stringify({
      type: 'thought',
      category: selectedCategory,
      text,
      title: title || null
    });

    tg.sendData(payload);
  });
</script>
</body>
</html>
