<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BIMO</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- Animated stars -->
<div class="stars" id="stars"></div>

<div class="page">

  <!-- BMO character -->
  <div class="bmo-wrap">
    <svg class="bmo-svg" viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">
      <!-- Body -->
      <rect x="10" y="15" width="100" height="115" rx="14" ry="14" fill="#7BC8A4"/>
      <!-- Inner border -->
      <rect x="15" y="20" width="90" height="105" rx="10" ry="10" fill="none" stroke="#5CA88C" stroke-width="1.5"/>
      <!-- Screen bezel -->
      <rect x="20" y="25" width="80" height="58" rx="8" ry="8" fill="#4A9B7F"/>
      <!-- Screen glow -->
      <rect x="23" y="28" width="74" height="52" rx="6" ry="6" fill="#A8E6CF">
        <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
      </rect>
      <!-- Screen content: eyes -->
      <ellipse cx="44" cy="50" rx="9" ry="10" fill="white"/>
      <ellipse cx="76" cy="50" rx="9" ry="10" fill="white"/>
      <ellipse cx="44" cy="51" rx="5" ry="6" fill="#1B2A3C">
        <animate attributeName="cy" values="51;53;51" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="76" cy="51" rx="5" ry="6" fill="#1B2A3C">
        <animate attributeName="cy" values="51;53;51" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <!-- Shine dots -->
      <circle cx="47" cy="48" r="2" fill="white" opacity="0.9"/>
      <circle cx="79" cy="48" r="2" fill="white" opacity="0.9"/>
      <!-- Mouth -->
      <path d="M48 68 Q60 76 72 68" stroke="#4A9B7F" stroke-width="2.5" fill="none" stroke-linecap="round">
        <animate attributeName="d" values="M48 68 Q60 76 72 68;M48 70 Q60 74 72 70;M48 68 Q60 76 72 68" dur="5s" repeatCount="indefinite"/>
      </path>
      <!-- Divider line -->
      <line x1="20" y1="95" x2="100" y2="95" stroke="#5CA88C" stroke-width="1"/>
      <!-- Buttons row -->
      <circle cx="38" cy="112" r="8" fill="#FF6B9D">
        <animate attributeName="r" values="8;9;8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="60" cy="112" r="8" fill="#FFD700">
        <animate attributeName="r" values="8;9;8" dur="2.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="82" cy="112" r="8" fill="#74B9FF">
        <animate attributeName="r" values="8;9;8" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      <!-- Side ports -->
      <rect x="5" y="50" width="5" height="12" rx="2" fill="#5CA88C"/>
      <rect x="5" y="68" width="5" height="8" rx="2" fill="#4A9B7F"/>
      <rect x="110" y="50" width="5" height="12" rx="2" fill="#5CA88C"/>
    </svg>
  </div>

  <h1 class="title">BIMO</h1>
  <p class="subtitle">Твой приключенческий дневник</p>

  <!-- Navigation buttons -->
  <a class="nav-btn thought" href="thought.html">
    <span class="icon">💭</span>
    <div class="label">
      <strong>Записать мысль</strong>
      <span>Мысли, идеи, события дня</span>
    </div>
  </a>

  <a class="nav-btn file" href="file.html">
    <span class="icon">📎</span>
    <div class="label">
      <strong>Добавить файл</strong>
      <span>Документы, текстовые заметки</span>
    </div>
  </a>

</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  // Generate stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      width: ${size}px; height: ${size}px;
      top: ${Math.random() * 100}%;
      left: ${Math.random() * 100}%;
      --dur: ${Math.random() * 3 + 2}s;
      --delay: ${Math.random() * 3}s;
    `;
    starsEl.appendChild(s);
  }
</script>
</body>
</html>
