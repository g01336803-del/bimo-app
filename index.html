<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BIMO</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- Stars in sky zone -->
<div class="stars" id="stars"></div>

<!-- Window with night sky -->
<div class="window-frame">
  <div class="window-stars" id="win-stars"></div>
</div>

<div class="page">

  <!-- Jake with headphones holding BMO -->
  <div class="jake-wrap">
    <svg class="jake-svg" viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg">

      <!-- Body -->
      <ellipse cx="70" cy="105" rx="32" ry="28" fill="#F7C948"/>
      <!-- Neck -->
      <rect x="62" y="82" width="16" height="14" rx="4" fill="#F7C948"/>

      <!-- Head -->
      <ellipse cx="70" cy="68" rx="38" ry="36" fill="#F7C948"/>

      <!-- Ears -->
      <ellipse cx="32" cy="52" rx="10" ry="14" fill="#F7C948"/>
      <ellipse cx="108" cy="52" rx="10" ry="14" fill="#F7C948"/>
      <ellipse cx="32" cy="52" rx="6"  ry="9"  fill="#E8B830"/>
      <ellipse cx="108" cy="52" rx="6"  ry="9"  fill="#E8B830"/>

      <!-- Headphone band over head -->
      <path d="M 34 42 Q 70 10 106 42" stroke="#1C1C1C" stroke-width="5" fill="none" stroke-linecap="round"/>

      <!-- Headphone cups -->
      <ellipse cx="30" cy="50" rx="13" ry="16" fill="#2A2A2A"/>
      <ellipse cx="30" cy="50" rx="9"  ry="11" fill="#111"/>
      <ellipse cx="30" cy="50" rx="5"  ry="6"  fill="#333"/>
      <ellipse cx="110" cy="50" rx="13" ry="16" fill="#2A2A2A"/>
      <ellipse cx="110" cy="50" rx="9"  ry="11" fill="#111"/>
      <ellipse cx="110" cy="50" rx="5"  ry="6"  fill="#333"/>

      <!-- Eyes -->
      <ellipse cx="57" cy="66" rx="10" ry="11" fill="white"/>
      <ellipse cx="83" cy="66" rx="10" ry="11" fill="white"/>
      <ellipse cx="57" cy="67" rx="6"  ry="7"  fill="#111">
        <animate attributeName="cy" values="67;69;67" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="83" cy="67" rx="6"  ry="7"  fill="#111">
        <animate attributeName="cy" values="67;69;67" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="60" cy="64" r="2.5" fill="white" opacity="0.9"/>
      <circle cx="86" cy="64" r="2.5" fill="white" opacity="0.9"/>

      <!-- Nose -->
      <ellipse cx="70" cy="79" rx="4" ry="2.5" fill="#E8A820"/>

      <!-- Mouth (happy) -->
      <path d="M 56 86 Q 70 96 84 86" stroke="#C88A10" stroke-width="2.5" fill="none" stroke-linecap="round">
        <animate attributeName="d" values="M 56 86 Q 70 96 84 86;M 58 87 Q 70 93 82 87;M 56 86 Q 70 96 84 86" dur="5s" repeatCount="indefinite"/>
      </path>

      <!-- Left arm holding BMO -->
      <path d="M 42 108 Q 24 118 20 132" stroke="#F7C948" stroke-width="10" fill="none" stroke-linecap="round"/>
      <!-- Right arm -->
      <path d="M 98 108 Q 118 112 122 120" stroke="#F7C948" stroke-width="10" fill="none" stroke-linecap="round"/>

      <!-- BMO (held by Jake) -->
      <rect x="10" y="120" width="38" height="40" rx="5" ry="5" fill="#7BC8A4"/>
      <rect x="14" y="124" width="30" height="22" rx="3" ry="3" fill="#4A9B7F"/>
      <rect x="16" y="126" width="26" height="18" rx="2" ry="2" fill="#A8E6CF">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
      </rect>
      <!-- BMO eyes -->
      <ellipse cx="24" cy="134" rx="3.5" ry="4" fill="white"/>
      <ellipse cx="34" cy="134" rx="3.5" ry="4" fill="white"/>
      <ellipse cx="24" cy="134" rx="2" ry="2.5" fill="#111"/>
      <ellipse cx="34" cy="134" rx="2" ry="2.5" fill="#111"/>
      <!-- BMO mouth -->
      <path d="M21 142 Q29 146 37 142" stroke="#4A9B7F" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- BMO buttons -->
      <circle cx="20" cy="152" r="3" fill="#FF6B9D"/>
      <circle cx="29" cy="152" r="3" fill="#FFD700"/>
      <circle cx="38" cy="152" r="3" fill="#74B9FF"/>

      <!-- Legs -->
      <rect x="55" y="128" width="11" height="20" rx="5" fill="#E8B830"/>
      <rect x="74" y="128" width="11" height="20" rx="5" fill="#E8B830"/>
      <!-- Feet -->
      <ellipse cx="60" cy="150" rx="9" ry="5" fill="#F7C948"/>
      <ellipse cx="80" cy="150" rx="9" ry="5" fill="#F7C948"/>
      <!-- Socks -->
      <rect x="53" y="142" width="14" height="8" rx="3" fill="white"/>
      <rect x="72" y="142" width="14" height="8" rx="3" fill="white"/>

      <!-- Headphone cord glow -->
      <circle cx="30" cy="50" r="3" fill="#F7C948" opacity="0.6">
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </svg>
  </div>

  <h1 class="title">BIMO</h1>
  <p class="subtitle">Математическое время приключений!</p>

  <!-- Nav -->
  <a class="nav-btn thought" href="thought.html">
    <span class="icon">💭</span>
    <div class="label">
      <strong>Записать мысль</strong>
      <span>Мысли, идеи, события дня</span>
    </div>
  </a>

  <a class="nav-btn file" href="file.html">
    <span class="icon">📎</span>
    <div class="label">
      <strong>Добавить файл</strong>
      <span>Документы и текстовые заметки</span>
    </div>
  </a>

</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  // Sky stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 55; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 2.5 + 0.5;
    s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--dur:${(Math.random()*3+2).toFixed(1)}s;--delay:${(Math.random()*3).toFixed(1)}s;`;
    starsEl.appendChild(s);
  }

  // Window stars
  const winEl = document.getElementById('win-stars');
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('div');
    s.className = 'window-star';
    const sz = Math.random() * 1.8 + 0.5;
    s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*90}%;left:${Math.random()*90}%;--dur:${(Math.random()*2+1.5).toFixed(1)}s;--delay:${(Math.random()*2).toFixed(1)}s;`;
    winEl.appendChild(s);
  }
</script>
</body>
</html>
